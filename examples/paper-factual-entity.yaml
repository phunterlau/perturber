  adapter: auto
  device: auto
  dtype: auto
  chat_template: true
  enable_thinking: false
pairs:
  - id: direct-question
    original: What is the capital of France? Answer with only the city name.
    perturbed: What is the capital of the United Kingdom? Answer with only the city name.
    metadata:
      perturbation: entity swap
  - id: completion
    original: Complete this fact with only the missing city name. The capital of France is
