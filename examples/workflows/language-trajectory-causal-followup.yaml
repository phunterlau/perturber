schema_version: probe.workflow/v1
name: qwen3-0.6b-language-trajectory-causal-followup
description: Qualification-gated comparison of direct, layer-aware downstream, and overlap FFN candidates with native intervention trajectories.
rank:
  schema_version: probe.rank/v1
  kind: rank
  name: language-routing-ranking
  model:
    id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    adapter: qwen3
    device: mps
    dtype: float16
    chat_template: true
    enable_thinking: false
  pairs:
    - id: capital
      split: discovery
      original: What is the capital of France? Answer in English.
      perturbed: 法国的首都是哪里？请用中文回答。
      metadata: {perturbation_family: language-routing}
    - id: arithmetic
      split: discovery
      original: What is two plus two? Answer in English.
      perturbed: 二加二等于多少？请用中文回答。
      metadata: {perturbation_family: language-routing}
    - id: science
      split: heldout
      original: At what temperature does pure water freeze? Answer in English.
      perturbed: 纯水在什么温度结冰？请用中文回答。
      metadata: {perturbation_family: language-routing}
  observable:
    name: language:chinese-minus-english
    target_tokens: [的, 是, 我, 这, 在]
    control_tokens: [The, It, This, A, I]
  ranking: {top_k: 500, pair_aggregation: rms}
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 100000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
  tags: {paper_case: EN-vs-ZH, experiment: trajectory-causal-followup}
qualification:
  schema_version: probe.qualify/v1
  kind: qualify
  name: language-generation-gate
  parent_run_id: $rank
  generation: {max_new_tokens: 8, do_sample: false, seed: 260427401}
  evaluator:
    kind: unicode_script
    target_values: [han]
    control_values: [latin]
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 10000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
trajectory:
  schema_version: probe.trajectory/v1
  kind: trajectory
  name: language-native-trajectory
  parent_run_id: $rank
  checkpoints: [block_input, post_attention, post_ffn]
  top_k: 10
  transition_limit: 8
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 50000000
    allow_download: false
    trust_remote_code: false
    seed: 260427404
ffn_coupling:
  schema_version: probe.ffn-coupling/v1
  kind: ffn_coupling
  name: language-layer-aware-ffn
  parent_run_id: $rank
  trajectory_run_id: $trajectory
  methods: [native_local_readout, downstream_endpoint_gradient]
  top_k: 500
  max_backward_passes: 6
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 100000000
    allow_download: false
    trust_remote_code: false
    seed: 260427405
interventions:
  - schema_version: probe.intervention/v1
    kind: intervention
    name: direct-readout-patch
    parent_run_id: $rank
    qualification_run_id: $qualification
    trajectory_run_id: $trajectory
    selection:
      strategy: ranked_top_k
      top_k: 16
      sign: positive
      min_sign_consistency: 0.6666666667
    operation: {mode: patch, condition: auto}
    sweep: {neuron_counts: [4, 16], strengths: [1.0]}
    controls: {samples: 3, same_layer: true}
    execution:
      max_forward_passes: 24
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427410
  - schema_version: probe.intervention/v1
    kind: intervention
    name: downstream-gradient-patch
    parent_run_id: $ffn_coupling
    qualification_run_id: $qualification
    trajectory_run_id: $trajectory
    selection:
      strategy: ranked_top_k
      top_k: 16
      sign: positive
      min_sign_consistency: 0.6666666667
    operation: {mode: patch, condition: auto}
    sweep: {neuron_counts: [4, 16], strengths: [1.0]}
    controls: {samples: 3, same_layer: true}
    execution:
      max_forward_passes: 24
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427411
  - schema_version: probe.intervention/v1
    kind: intervention
    name: direct-downstream-overlap-patch
    parent_run_id: $ffn_coupling
    qualification_run_id: $qualification
    trajectory_run_id: $trajectory
    selection:
      strategy: ranked_top_k
      candidate_method: direct_downstream_overlap
      overlap_pool_size: 24
      top_k: 16
      sign: positive
      min_sign_consistency: 0.6666666667
    operation: {mode: patch, condition: auto}
    sweep: {neuron_counts: [4, 16], strengths: [1.0]}
    controls: {samples: 3, same_layer: true}
    execution:
      max_forward_passes: 24
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427412
