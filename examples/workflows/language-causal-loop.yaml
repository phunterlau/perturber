schema_version: probe.workflow/v1
name: qwen3-0.6b-language-causal-loop
description: Seeded paper-pattern workflow from EN/ZH ranking through generated qualification, FFN ablation, and residual-direction controls.
rank:
  schema_version: probe.rank/v1
  kind: rank
  name: language-routing-ranking
  model:
    id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    adapter: qwen3
    device: mps
    dtype: float16
    chat_template: true
    enable_thinking: false
  pairs:
    - id: capital
      original: What is the capital of France? Answer in English.
      perturbed: 法国的首都是哪里？请用中文回答。
      metadata:
        perturbation_family: language-routing
    - id: arithmetic
      original: What is two plus two? Answer in English.
      perturbed: 二加二等于多少？请用中文回答。
      metadata:
        perturbation_family: language-routing
    - id: science
      original: At what temperature does pure water freeze? Answer in English.
      perturbed: 纯水在什么温度结冰？请用中文回答。
      metadata:
        perturbation_family: language-routing
  observable:
    name: language:chinese-minus-english
    target_tokens: [的, 是, 我, 这, 在]
    control_tokens: [The, It, This, A, I]
  ranking:
    top_k: 500
    pair_aggregation: rms
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 100000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
  tags:
    paper_case: EN-vs-ZH
    fidelity: representative-smoke
qualification:
  schema_version: probe.qualify/v1
  kind: qualify
  name: language-first-generation-gate
  parent_run_id: $rank
  generation:
    max_new_tokens: 8
    do_sample: false
    seed: 260427401
  evaluator:
    kind: unicode_script
    target_values: [han]
    control_values: [latin]
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 10000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
interventions:
  - schema_version: probe.intervention/v1
    kind: intervention
    name: language-ranked-neuron-ablation
    parent_run_id: $rank
    qualification_run_id: $qualification
    selection:
      strategy: ranked_top_k
      top_k: 20
      sign: positive
      min_sign_consistency: 0.6666666667
    operation:
      mode: ablate
      condition: perturbed
    sweep:
      neuron_counts: [1, 5, 20]
      strengths: [0.0, 0.5]
    controls:
      samples: 3
      same_layer: true
    additivity:
      top_n: 0
    execution:
      max_forward_passes: 72
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427402
directions:
  - schema_version: probe.direction/v1
    kind: direction
    name: language-residual-direction-layer-sweep
    parent_run_id: $rank
    qualification_run_id: $qualification
    layers: [18, 24]
    betas: [-0.05, 0.05]
    condition: perturbed
    normalization: residual_norm
    random_direction_samples: 3
    execution:
      max_forward_passes: 48
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427403
