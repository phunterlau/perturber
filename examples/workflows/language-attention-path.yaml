schema_version: probe.workflow/v1
name: qwen3-0.6b-language-attention-path
description: Seeded EN/ZH workflow from qualification through attention-head ranking, controlled patching, token routes, and a two-stage sender-receiver path test.
rank:
  schema_version: probe.rank/v1
  kind: rank
  name: language-routing-ranking
  model:
    id: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    adapter: qwen3
    device: mps
    dtype: float16
    chat_template: true
    enable_thinking: false
  pairs:
    - id: capital
      original: What is the capital of France? Answer in English.
      perturbed: 法国的首都是哪里？请用中文回答。
      metadata:
        perturbation_family: language-routing
    - id: arithmetic
      original: What is two plus two? Answer in English.
      perturbed: 二加二等于多少？请用中文回答。
      metadata:
        perturbation_family: language-routing
    - id: science
      original: At what temperature does pure water freeze? Answer in English.
      perturbed: 纯水在什么温度结冰？请用中文回答。
      metadata:
        perturbation_family: language-routing
  observable:
    name: language:chinese-minus-english
    target_tokens: [的, 是, 我, 这, 在]
    control_tokens: [The, It, This, A, I]
  ranking:
    top_k: 500
    pair_aggregation: signed_mean
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 100000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
  tags:
    paper_case: EN-vs-ZH
    fidelity: representative-smoke
qualification:
  schema_version: probe.qualify/v1
  kind: qualify
  name: language-first-generation-gate
  parent_run_id: $rank
  generation:
    max_new_tokens: 8
    do_sample: false
    seed: 260427401
  evaluator:
    kind: unicode_script
    target_values: [han]
    control_values: [latin]
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 10000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
attention_rank:
  schema_version: probe.attention-rank/v1
  kind: attention_rank
  name: language-attention-head-ranking
  parent_run_id: $rank
  qualification_run_id: $qualification
  ranking:
    top_k: 64
    pair_aggregation: rms
  execution:
    max_forward_passes: 6
    max_artifact_bytes: 50000000
    allow_download: false
    trust_remote_code: false
    seed: 260427401
attention_interventions:
  - schema_version: probe.attention-intervention/v1
    kind: attention_intervention
    name: language-top-head-patch
    parent_run_id: $attention_rank
    qualification_run_id: $qualification
    selection:
      strategy: ranked_top_k
      top_k: 16
      sign: any
      min_sign_consistency: 0.0
    operation:
      mode: patch
      condition: auto
    sweep:
      head_counts: [1, 4, 16]
      strengths: [1.0]
    controls:
      samples: 5
    execution:
      max_forward_passes: 54
      max_artifact_bytes: 50000000
      allow_download: false
      trust_remote_code: false
      seed: 260427401
attention_traces:
  - schema_version: probe.attention-trace/v1
    kind: attention_trace
    name: language-top-head-token-routes
    trace_kind: token_edges
    parent_run_id: $attention_rank
    pair_ids: [capital, arithmetic, science]
    heads:
      - {layer: 25, head: 0}
      - {layer: 18, head: 12}
      - {layer: 24, head: 0}
      - {layer: 24, head: 2}
    max_token_edges: 100
    execution:
      max_forward_passes: 6
      max_artifact_bytes: 20000000
      allow_download: false
      trust_remote_code: false
      seed: 260427401
  - schema_version: probe.attention-trace/v1
    kind: attention_trace
    name: language-l18h12-to-l25h0-path
    trace_kind: head_paths
    parent_run_id: $attention_rank
    parent_intervention_run_id: $attention_intervention
    pair_ids: [capital]
    senders:
      - {layer: 18, head: 12}
    receivers:
      - {layer: 25, head: 0}
    operation: patch
    alignments:
      - pair_id: capital
        mode: identity
    controls:
      samples: 5
    execution:
      max_forward_passes: 13
      max_artifact_bytes: 10000000
      allow_download: false
      trust_remote_code: false
      seed: 260427401
