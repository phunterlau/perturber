[project]
name = "perturbation-probing-workbench"
version = "0.2.0"
description = "Local-first perturbation-probing research platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.135.3",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "textual==8.2.8",
    "torch==2.13.0",
    "transformers==5.14.1",
    "typer==0.27.0",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
probe = "probing.cli:main"
probe-workbench = "probing.cli:legacy_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
